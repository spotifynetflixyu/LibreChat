name: Web Client Build
on:
  pull_request:
    paths:
      - client/**
      - packages/client/**
      - packages/data-provider/**
      - package.json
      - package-lock.json
      - .github/workflows/frontend-review.yml
      - '!**.md'
  push:
    branches:
      - dev
    paths:
      - client/**
      - packages/client/**
      - packages/data-provider/**
      - package.json
      - package-lock.json
      - .github/workflows/frontend-review.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
env:
  NODE_OPTIONS: '--max-old-space-size=6144'
  SCARF_ANALYTICS: 'false'
jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 24.16.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            client/node_modules
            packages/client/node_modules
            packages/data-provider/node_modules
          key: node-modules-frontend-${{ runner.os }}-24.16.0-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Restore data-provider build cache
        id: cache-data-provider
        uses: actions/cache@v5
        with:
          path: packages/data-provider/dist
          key: >-
            build-data-provider-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json',
            'packages/data-provider/src/**', 'packages/data-provider/tsconfig*.json',
            'packages/data-provider/tsdown.config.mjs', 'packages/data-provider/package.json') }}
      - name: Build data-provider
        if: steps.cache-data-provider.outputs.cache-hit != 'true'
        run: npm run build:data-provider
      - name: Restore client-package build cache
        id: cache-client-package
        uses: actions/cache@v5
        with:
          path: packages/client/dist
          key: >-
            build-client-package-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json',
            'packages/client/src/**', 'packages/client/tsconfig*.json', 'packages/client/tsdown.config.mjs',
            'packages/client/package.json', 'packages/data-provider/src/**', 'packages/data-provider/tsconfig*.json',
            'packages/data-provider/tsdown.config.mjs', 'packages/data-provider/package.json') }}
      - name: Build client-package
        if: steps.cache-client-package.outputs.cache-hit != 'true'
        run: npm run build:client-package
      - name: Upload data-provider build
        uses: actions/upload-artifact@v6
        with:
          name: build-data-provider
          path: packages/data-provider/dist
          retention-days: 2
      - name: Upload client-package build
        uses: actions/upload-artifact@v6
        with:
          name: build-client-package
          path: packages/client/dist
          retention-days: 2
  typecheck:
    name: TypeScript type checks (client)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 24.16.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            client/node_modules
            packages/client/node_modules
            packages/data-provider/node_modules
          key: node-modules-frontend-${{ runner.os }}-24.16.0-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Download data-provider build
        uses: actions/download-artifact@v7
        with:
          name: build-data-provider
          path: packages/data-provider/dist
      - name: Download client-package build
        uses: actions/download-artifact@v7
        with:
          name: build-client-package
          path: packages/client/dist
      - name: Type check client
        run: npm run typecheck
        working-directory: client
      - name: Type check shared client
        run: npx tsc --noEmit -p packages/client/tsconfig.json
  build-verify:
    name: Vite build verification
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 24.16.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            client/node_modules
            packages/client/node_modules
            packages/data-provider/node_modules
          key: node-modules-frontend-${{ runner.os }}-24.16.0-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Download data-provider build
        uses: actions/download-artifact@v7
        with:
          name: build-data-provider
          path: packages/data-provider/dist
      - name: Download client-package build
        uses: actions/download-artifact@v7
        with:
          name: build-client-package
          path: packages/client/dist
      - name: Build client
        run: cd client && npm run build:ci
