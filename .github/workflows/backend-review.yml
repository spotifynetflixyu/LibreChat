name: Web API Build
on:
  push:
    branches:
      - dev
    paths:
      - api/**
      - packages/**
      - package.json
      - package-lock.json
      - .github/workflows/backend-review.yml
      - '!**.md'
  pull_request:
    paths:
      - api/**
      - packages/**
      - package.json
      - package-lock.json
      - .github/workflows/backend-review.yml
      - '!**.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
env:
  NODE_OPTIONS: '--max-old-space-size=6144'
  SCARF_ANALYTICS: 'false'
jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 24.16.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            api/node_modules
            packages/api/node_modules
            packages/data-provider/node_modules
            packages/data-schemas/node_modules
          key: node-modules-backend-${{ runner.os }}-24.16.0-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Restore data-provider build cache
        id: cache-data-provider
        uses: actions/cache@v5
        with:
          path: packages/data-provider/dist
          key: >-
            build-data-provider-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json',
            'packages/data-provider/src/**', 'packages/data-provider/tsconfig*.json',
            'packages/data-provider/tsdown.config.mjs', 'packages/data-provider/package.json') }}
      - name: Build data-provider
        if: steps.cache-data-provider.outputs.cache-hit != 'true'
        run: npm run build:data-provider
      - name: Restore data-schemas build cache
        id: cache-data-schemas
        uses: actions/cache@v5
        with:
          path: packages/data-schemas/dist
          key: >-
            build-data-schemas-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json',
            'packages/data-schemas/src/**', 'packages/data-schemas/tsconfig*.json',
            'packages/data-schemas/tsdown.config.mjs', 'packages/data-schemas/package.json',
            'packages/data-provider/src/**', 'packages/data-provider/tsconfig*.json',
            'packages/data-provider/tsdown.config.mjs', 'packages/data-provider/package.json') }}
      - name: Build data-schemas
        if: steps.cache-data-schemas.outputs.cache-hit != 'true'
        run: npm run build:data-schemas
      - name: Restore api build cache
        id: cache-api
        uses: actions/cache@v5
        with:
          path: packages/api/dist
          key: >-
            build-api-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json', 'packages/api/src/**',
            'packages/api/tsconfig*.json', 'packages/api/tsdown.config.mjs', 'packages/api/package.json',
            'packages/data-provider/src/**', 'packages/data-provider/tsconfig*.json',
            'packages/data-provider/tsdown.config.mjs', 'packages/data-provider/package.json',
            'packages/data-schemas/src/**', 'packages/data-schemas/tsconfig*.json',
            'packages/data-schemas/tsdown.config.mjs', 'packages/data-schemas/package.json') }}
      - name: Build api
        if: steps.cache-api.outputs.cache-hit != 'true'
        run: npm run build:api
      - name: Upload data-provider build
        uses: actions/upload-artifact@v6
        with:
          name: build-data-provider
          path: packages/data-provider/dist
          retention-days: 2
      - name: Upload data-schemas build
        uses: actions/upload-artifact@v6
        with:
          name: build-data-schemas
          path: packages/data-schemas/dist
          retention-days: 2
      - name: Upload api build
        uses: actions/upload-artifact@v6
        with:
          name: build-api
          path: packages/api/dist
          retention-days: 2
  typecheck:
    name: TypeScript type checks
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 24.16.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            api/node_modules
            packages/api/node_modules
            packages/data-provider/node_modules
            packages/data-schemas/node_modules
          key: node-modules-backend-${{ runner.os }}-24.16.0-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Download data-provider build
        uses: actions/download-artifact@v7
        with:
          name: build-data-provider
          path: packages/data-provider/dist
      - name: Download data-schemas build
        uses: actions/download-artifact@v7
        with:
          name: build-data-schemas
          path: packages/data-schemas/dist
      - name: Download api build
        uses: actions/download-artifact@v7
        with:
          name: build-api
          path: packages/api/dist
      - name: Type check data-provider
        run: npx tsc --noEmit -p packages/data-provider/tsconfig.json
      - name: Type check data-schemas
        run: npx tsc --noEmit -p packages/data-schemas/tsconfig.json
      - name: Type check @librechat/api
        run: npx tsc --noEmit -p packages/api/tsconfig.json
