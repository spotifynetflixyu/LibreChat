name: Playwright E2E Tests

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-flow-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: '--max-old-space-size=6144'
  SCARF_ANALYTICS: 'false'
  E2E_CHROMIUM_CHANNEL: chrome
  E2E_BASE_URL: 'http://localhost:3098'

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.16.0'
          cache: npm
      - run: npm ci
      - run: google-chrome --version
      - run: npx playwright install ffmpeg
      - name: Build and verify normal web flows
        run: npm run e2e:mock:ci
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: web-flow-report
          path: |
            e2e/playwright-report/
            e2e/specs/.test-results/
          include-hidden-files: true
          retention-days: 7
